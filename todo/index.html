<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome" class="welcome hidden">
        <p>Welcome! 👋 Add your first task to get started.</p>
        <button id="close-welcome">✕</button>
    </div>

    <div class="app">
        <div class="top">
            <h1>My Tasks</h1>
            <button id="theme-btn" class="theme-btn">🌙 Dark</button>
        </div>

        <form id="todo-form">
            <input id="todo-input" placeholder="New task..." autocomplete="off">
            <button>Add</button>
        </form>

        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="done">Done</button>
        </div>

        <ul id="todo-list"></ul>

        <p id="count" class="count"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
